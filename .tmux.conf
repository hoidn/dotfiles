set -g mouse on
set -s set-clipboard on

# Copy mouse selections from tmux copy mode to the X11 system clipboard.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode C-y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# image.nvim: let nvim send sixel images through tmux to the terminal.
set -gq allow-passthrough on
set -g visual-activity off
set -g focus-events on
